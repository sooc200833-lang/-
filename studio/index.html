<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>웹툰 선택지 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@700;800&family=Nanum+Pen+Script&family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1716;--paper:#fff;--bg:#ece8e2;--mute:#9a928a;--line:#eee;--card:#faf7f2;--acc:#e0789b;--fs:14px}
body.dark{--paper:#171514;--bg:#0d0c0b;--mute:#8d857d;--line:#2a2624;--card:#201d1b;--ink:#1c1716}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Nanum Gothic',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.dark{color:#e9e4de}
#app{max-width:480px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08);position:relative;overflow-x:clip}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;padding:9px 12px;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{font-family:'Gowun Batang';font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip,header button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 10px;color:inherit;cursor:pointer;white-space:nowrap}
.chip.on,header button.on{background:#1c1716;color:#fff;border-color:#1c1716}
body.dark .chip.on,body.dark header button.on{background:#e9e4de;color:#171514}
.tab{display:none}.tab.on{display:block}
nav.bottom{position:fixed;left:50%;translate:-50% 0;bottom:0;width:100%;max-width:480px;z-index:60;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;font:inherit;font-size:11px;background:none;border:0;color:var(--mute);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button b{font-size:17px;font-weight:400;line-height:1}
nav.bottom button.on{color:var(--acc);font-weight:800}
.pad{padding:14px 14px 90px}
h2{font-family:'Gowun Batang';font-size:17px;margin:4px 0 10px}
h3{font-family:'Gowun Batang';font-size:14px;margin:18px 0 8px}
.sm{font-size:12px;color:var(--mute);line-height:1.6}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.btn{font:inherit;font-size:13px;font-weight:800;border:2px solid #1c1716;background:#1c1716;color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer}
body.dark .btn{background:#e9e4de;color:#171514;border-color:#e9e4de}
.btn.ghost{background:transparent;color:inherit}
.btn.sm2{font-size:12px;padding:5px 10px}

/* ── 플레이: 컷 ── */
#feed{padding-bottom:62vh}
.pn{position:relative;margin:46px 14px 0;border:2px solid var(--ink);background:#fff;isolation:isolate}
body.dark .pn{border-color:#3a3532}
.pn.fb{margin-left:0;margin-right:0;border-left:0;border-right:0}
.pn.nb{border:0}
.pn .art{position:absolute;inset:0;overflow:hidden;z-index:0}
.pn .bgsvg{position:absolute;inset:0}
.pn .bgsvg svg{width:100%;height:100%;display:block}
.pn .zone{position:relative;z-index:6;width:100%}
.pn .stage{position:relative;width:100%;z-index:2}
.cw{position:absolute}
.cw svg{width:100%;height:auto;display:block}
.cw.flip svg{transform:scaleX(-1)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.fx-lines{background:repeating-conic-gradient(from 0deg at 50% 70%,rgba(20,15,15,.75) 0 .7deg,transparent .7deg 5deg);-webkit-mask:radial-gradient(circle at 50% 70%,transparent 30%,#000 75%);mask:radial-gradient(circle at 50% 70%,transparent 30%,#000 75%)}
.fx-gloom{background:repeating-linear-gradient(90deg,rgba(40,30,60,.42) 0 2px,transparent 2px 9px);-webkit-mask:linear-gradient(#000,transparent 55%);mask:linear-gradient(#000,transparent 55%)}
.fx-sparkle span,.fx-flowers span{position:absolute;line-height:1}
.fx-sparkle span{color:#fff;text-shadow:0 0 6px #fff,0 0 2px #ff9ab8}
.fx-flowers span{color:#ffd1de;opacity:.9}
.fx-vignette{background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.6))}
.bubs{position:absolute;inset:0;z-index:7;pointer-events:none}
.bubs .bb,.zone .bb{pointer-events:auto}

/* 말풍선 */
.bb{position:absolute;width:max-content;max-width:64%;background:#fff;color:#1c1716;border:1.8px solid #1c1716;border-radius:50%;padding:14px 20px;font-size:calc(var(--fs) * var(--bs,1));font-weight:800;line-height:1.45;text-align:center;word-break:keep-all;letter-spacing:-.2px}
.bb::before,.bb::after{content:'';position:absolute;border-style:solid;border-color:transparent;left:var(--tx,50%)}
.bb::before{bottom:-15px;border-width:16px 6px 0 6px;border-top-color:#1c1716;translate:-50% 0;transform:skewX(var(--sk,0deg))}
.bb::after{bottom:-11.5px;border-width:13px 4.3px 0 4.3px;border-top-color:#fff;translate:-50% 0;transform:skewX(var(--sk,0deg))}
.bb.tn::before,.bb.tn::after{display:none}
.bb.t{border-radius:44%;font-weight:700;color:#3a3330}
.bb.t::before{bottom:-14px;width:11px;height:11px;border:1.8px solid #1c1716;border-radius:50%;background:#fff;transform:none}
.bb.t::after{bottom:-24px;width:6px;height:6px;border:1.6px solid #1c1716;border-radius:50%;background:#fff;transform:none;translate:calc(-50% + var(--dx,4px)) 0}
.bb.w{border-style:dashed;font-weight:700;font-size:calc(var(--fs) - 1px)}
.bb.v{border-color:transparent;background:transparent;isolation:isolate}
.bb.v i.wb{position:absolute;inset:0;border:1.8px solid #1c1716;border-radius:50%;background:#fff;filter:url(#wob);z-index:-1}
.bb.v::after{bottom:-10px}
.bb.s{border:0;border-radius:0;background:var(--burst) center/100% 100% no-repeat;padding:30px 36px;font-size:calc(var(--fs) + 1.5px);font-weight:800}
.bb.s::before,.bb.s::after{display:none}
.bb.d{background:#141012;color:#fff;border-color:#141012}
.bb.d::after{border-top-color:#141012}
.bb.n{border-radius:0;font-family:'Gowun Batang';font-weight:700;font-size:calc(var(--fs) - 1.5px);padding:7px 11px;border-width:1.5px;text-align:left;max-width:78%}
.bb.n::before,.bb.n::after{display:none}
.bb.i{font-family:'Nanum Pen Script';font-weight:400;font-size:calc(var(--fs) + 7px);line-height:1.15;background:#fff0f5;border:1.5px solid #ef8fb0;border-radius:16px;color:#b4386a;padding:8px 14px}
.bb.i::before,.bb.i::after{display:none}
.bb.x{background:none;border:0;padding:0;font-family:'Black Han Sans';font-weight:400;font-size:46px;color:#fff;-webkit-text-stroke:2.2px #1c1716;paint-order:stroke fill;text-shadow:3px 3px 0 #1c1716;rotate:-7deg;max-width:none;white-space:nowrap}
.bb.x::before,.bb.x::after{display:none}
.pn .comical-generated{z-index:5}
.pn img.comical-generated,.pn svg.comical-generated{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.bb.cm{background:none!important;border:0!important;border-radius:0!important;box-shadow:none;padding:5px 10px;max-width:50%}
.bb.cm::before,.bb.cm::after{display:none}
.bb.hide-tail::before,.bb.hide-tail::after{display:none}
body.edit .bb:not(.sl){outline:2px dashed var(--acc);outline-offset:2px;cursor:grab;touch-action:none}
body.edit .bb.sl{outline:none}
.bb.drag{opacity:.85;cursor:grabbing;z-index:99}

/* 컷 밖 */
.txt{margin:70px 30px 0;text-align:center;font-family:'Gowun Batang';font-size:15.5px;line-height:1.9}
.txt.dark{background:#141012;color:#eee;margin:70px 0 0;padding:60px 30px}
.sfx{margin:56px 0 0;text-align:center;font-family:'Black Han Sans';font-size:64px;color:#fff;-webkit-text-stroke:2.5px #1c1716;paint-order:stroke fill;text-shadow:4px 4px 0 #1c1716;rotate:-5deg}
.sfx.red{color:#ff4a4a}
.sfx.quiet{font-family:'Gowun Batang';font-size:17px;-webkit-text-stroke:0;color:var(--mute);text-shadow:none;rotate:0deg;letter-spacing:8px}
.gap{height:60px}.gap.l{height:220px}
.stamp{margin:64px auto 0;text-align:center}
.stamp b{display:inline-block;font-family:'Black Han Sans';font-weight:400;font-size:34px;padding:8px 18px;border:4px solid currentColor;rotate:-6deg;letter-spacing:2px}
.stamp small{display:block;margin-top:16px;font-family:'Gowun Batang';font-size:13px;color:var(--mute)}
.stamp.happy{color:#e0789b}.stamp.bad{color:#888}.stamp.true{color:#2f7d5b}
.chat{margin:56px 34px 0;background:#b6c7d8;border-radius:18px;overflow:hidden;border:2px solid #1c1716;font-size:13px;color:#1c1716}
.chat .hd{background:#a5b8cb;padding:9px 14px;font-weight:800;font-size:12.5px;display:flex;justify-content:space-between}
.chat .bd{padding:12px 12px 16px;display:flex;flex-direction:column;gap:9px}
.chat .m{display:flex;gap:7px;align-items:flex-start}
.chat .av{width:28px;height:28px;border-radius:10px;background:#e9e3da;flex:0 0 28px;overflow:hidden}
.chat .av svg{width:200%;margin:-6px 0 0 -50%}
.chat .nm{font-size:10.5px;color:#3e4a57;margin-bottom:2px}
.chat .tx{background:#fff;border-radius:4px 12px 12px 12px;padding:6px 10px;font-weight:700;max-width:220px}
.cover{padding:74px 24px 40px;text-align:center}
.cover small{display:block;font-family:'Gowun Batang';font-size:13px;color:var(--mute);letter-spacing:3px}
.cover b{display:block;font-family:'Black Han Sans';font-weight:400;font-size:38px;line-height:1.18;margin-top:10px}
.how{margin:10px 22px 0;font-size:12.5px;line-height:1.75;color:var(--mute);text-align:center;font-family:'Gowun Batang'}
.end-card{margin:50px 18px 0;border:2px solid var(--ink);padding:20px;text-align:center;background:var(--paper)}
body.dark .end-card{border-color:#3a3532}
.end-card h3{font-family:'Black Han Sans';font-weight:400;font-size:20px;margin:0 0 8px}
.end-card p{font-size:12.5px;color:var(--mute);line-height:1.6}
.errbox{margin:40px 18px 0;padding:14px;border:2px solid #d33;border-radius:10px;color:#d33;font-size:13px;line-height:1.6;background:#fff5f5}
.note{position:absolute;left:0;right:0;bottom:0;z-index:9;font-size:11px;line-height:1.5;color:#fff;background:rgba(20,16,18,.85);padding:6px 9px;display:none;font-family:ui-monospace,Menlo,monospace}
body.memo .note{display:block}
.fade{animation:fin .7s ease both}
@keyframes fin{from{opacity:0;translate:0 16px}}

/* 선택 (Embla) */
.embla{position:absolute;left:0;right:0;z-index:8;overflow:hidden;touch-action:pan-y pinch-zoom}
.embla__container{display:flex}
.embla__slide{flex:0 0 100%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0 12px}
.embla__slide .bb{position:relative;translate:0 0;max-width:72%}
.embla__slide .sub{font-family:'Gowun Batang';font-size:11.5px;color:#fff;background:rgba(20,16,18,.66);padding:2px 9px;border-radius:99px}
.pn.choice .dots{position:absolute;left:50%;translate:-50% 0;bottom:8px;z-index:9;display:flex;gap:5px;background:rgba(255,255,255,.88);padding:5px 8px;border-radius:99px}
.dots i{width:6px;height:6px;border-radius:50%;background:#cfc7bd;transition:.2s}
.dots i.on{background:#1c1716;width:16px;border-radius:4px}
.edge{position:absolute;z-index:9;top:12%;bottom:12%;width:22px;display:flex;align-items:center;justify-content:center;color:#1c1716;font-size:22px;opacity:.5;pointer-events:none}
.edge.l{left:2px}.edge.r{right:2px}
.hint{position:absolute;left:50%;translate:-50% 0;bottom:38px;z-index:10;background:#1c1716;color:#fff;font-size:12px;padding:6px 12px;border-radius:99px;white-space:nowrap;animation:hint 1.8s ease-in-out infinite;pointer-events:none}
@keyframes hint{0%,100%{translate:-54% 0}50%{translate:-46% 0}}
.pn.choice.locked .dots,.pn.choice.locked .edge,.pn.choice.locked .hint{display:none}
.commit{position:relative;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);font-size:13px;gap:8px}
.commit .ar{font-size:22px;animation:bob 1.4s infinite}
@keyframes bob{50%{translate:0 6px}}
.commit.done{display:none}
.step{position:absolute;left:0;right:0;top:0;height:70vh;pointer-events:none}

/* 편집기 */
textarea#src{width:100%;height:52vh;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;resize:vertical;tab-size:2;white-space:pre;overflow:auto}
.snip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.snip::-webkit-scrollbar{display:none}
.snip .chip{flex:0 0 auto}
.err{font-size:12px;padding:6px 8px;border-left:3px solid #d33;background:rgba(220,50,50,.08);margin-top:6px;cursor:pointer;line-height:1.5}
.err.w{border-color:#e90;background:rgba(240,150,0,.1)}
.ok{font-size:12px;color:#2f7d5b;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid .ex{background:#f4efe8;border:1px solid var(--line);border-radius:10px;padding:4px 4px 6px;text-align:center;font-size:10px;color:#6a625a;cursor:pointer}
.grid .ex svg{width:100%;height:auto;display:block}
.grid .ex.sel{outline:2px solid var(--acc)}
.charhead{display:flex;gap:10px;align-items:center}
.charhead svg{width:64px;height:84px;background:#f4efe8;border-radius:10px;flex:0 0 64px}
code,.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:rgba(120,110,100,.14);padding:1px 5px;border-radius:5px}
pre.code{display:block;padding:10px;white-space:pre-wrap;line-height:1.6;margin-top:6px}
table.help{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.help,table.help tbody,table.help tr,table.help td{display:block}
table.help tr{padding:8px 0;border-bottom:1px solid var(--line)}
table.help td{line-height:1.55}
table.help td:first-child{font-family:ui-monospace,Menlo,monospace;color:var(--acc);word-break:break-all}
#map svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
#map text{font:11px 'Nanum Gothic';fill:#1c1716}
body.dark #map text{fill:#e9e4de}
.rep li{list-style:none;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5;display:flex;justify-content:space-between;gap:8px}
.rep li.lock{color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:80px;z-index:80;background:#1c1716;color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.on{opacity:1}
label.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
label.sw input[type=range]{width:120px}
.vars span{display:inline-block;margin:3px 4px 0 0;padding:3px 9px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:11.5px}
.vars b{color:var(--acc)}

header button:disabled{opacity:.3}
.pn img.mk{position:absolute;height:auto;z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
.sheet{position:fixed;inset:0;z-index:90;background:rgba(15,12,10,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:var(--paper);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet .pv{background:var(--bg);border-radius:10px;padding:2px 0 14px;margin:10px 0;max-height:46vh;overflow:auto}
.sheet .pv .pn{margin-top:14px}.sheet .pv .txt,.sheet .pv .sfx,.sheet .pv .stamp,.sheet .pv .chat{margin-top:18px}.sheet .pv .gap{height:14px}
.sheet select{padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:inherit;font:inherit;font-size:12.5px}
.cl-list{display:grid;gap:8px;margin-top:8px}
.cl-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.cl-item b{font-family:'Gowun Batang';font-size:14px}
.cl-item .sm{margin-top:2px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;background:rgba(224,120,155,.14);color:var(--acc);margin-right:4px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.mgrid div{background:#d8e4ec;border-radius:10px;padding:6px 2px 3px;text-align:center;font-size:9.5px;color:#334;cursor:pointer}
.mgrid img{width:100%;height:44px;object-fit:contain;display:block}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg .chip{flex:0 0 auto}
input.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;font:inherit;font-size:13px}
details.outline{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
details.outline summary{font-size:12.5px;cursor:pointer;padding:4px 0}
.ol{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.ol span.n{flex:1;cursor:pointer}
.ol .sm{font-size:11px}
.board .cl-item{cursor:default}

.addbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 2px}
.addbar button{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:8px 0 6px;font:inherit;font-size:11.5px;color:inherit;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.addbar button b{display:block;font-size:20px;font-weight:400;line-height:1.2}
.addbar button:active{transform:translate(2px,2px);box-shadow:none}
.sheet .box .search{margin:0}
.sheet .box .seg{margin-top:6px}
#src{min-height:46vh}
.pn .artimg{position:absolute;inset:0;background:#f3efe9 center/cover no-repeat;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#998}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter></svg>
<div id="app">
  <header>
    <h1 id="ttl">웹툰 선택지 스튜디오</h1>
    <button id="btnUndo" type="button" data-show="script play" title="되돌리기">↶</button>
    <button id="btnRedo" type="button" data-show="script play" title="다시 실행">↷</button>
    <button id="btnEdit" type="button" data-show="play" title="말풍선을 끌어 위치 저장">✋편집</button>
    <button id="btnRestart" type="button" data-show="play">처음</button>
  </header>

  <section id="tab-play" class="tab on"><div id="feed"></div></section>

  <section id="tab-script" class="tab"><div class="pad">
    <h2>대본 (ink)</h2>
    <div class="sm">아래 버튼으로 컷·대사·선택지를 골라 넣으면 문법을 몰라도 돼요. 직접 고쳐 써도 즉시 검사돼요.</div>
    <div class="snip" id="snips"></div>
    <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div id="errs"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="btnRun" type="button">▶ 처음부터 재생</button>
      <button class="btn ghost" id="btnCopy" type="button">복사</button>
      <button class="btn ghost" id="btnSample" type="button">샘플</button>
      <button class="btn ghost" id="btnFile" type="button">.ink 열기</button>
      <input type="file" id="file" accept=".ink,.txt,text/plain" hidden>
    </div>
  </div></section>

  <section id="tab-cliche" class="tab"><div class="pad" id="cliche"></div></section>

  <section id="tab-chars" class="tab"><div class="pad" id="chars"></div></section>
