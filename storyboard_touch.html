<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>콘티 구성기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#15161c;color:#f7f7fa}
iframe{border:0;width:100%;height:100%;display:block}
#gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#15161c;padding:20px}
.panel{width:min(480px,100%);max-height:90vh;overflow:auto}.sub{color:#a4a6b5;font-size:14px;line-height:1.6}
button{cursor:pointer;font:inherit;border-radius:13px;border:1px solid #434653;background:#252733;color:white;padding:16px;text-align:left;width:100%;margin:8px 0}
button.primary{background:#6259d8;border-color:#6259d8}button:disabled{opacity:.5;cursor:not-allowed}
.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #353744;padding:6px 0}.item button{flex:1;margin:0}.item .delete{flex:0 0 auto;width:auto;background:#422b32}
small{display:block;color:#b8bac6;margin-top:5px}
#list{margin-top:16px}#back{margin-top:16px}
</style></head><body>
<div id="gate"><div class="panel"><h1>콘티 구성기</h1><p class="sub" id="message">작업을 시작할 방법을 선택하세요. 현재 작업은 새로 시작하기 전에 보관할 수 있습니다.</p>
<div id="home"><button class="primary" id="new">＋ 새로 하기<small>현재 작업을 저장하고 새 프로젝트 시작</small></button>
<button id="resume">▣ 이어서 하기<small>최근 작업 또는 저장된 프로젝트 열기</small></button></div>
<div id="list" hidden></div><button id="back" hidden>← 처음으로</button></div></div>
<script>
(function(){
const ARCHIVE='__namul_storyboard_archives_v1', ACTIVE='__namul_storyboard_active_v1', PREFIX='__namul_storyboard_';
const gate=document.getElementById('gate'),list=document.getElementById('list'),home=document.getElementById('home'),back=document.getElementById('back'),msg=document.getElementById('message');
const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const archives=()=>read(ARCHIVE,[]);
const keys=()=>Object.keys(localStorage).filter(k=>!k.startsWith(PREFIX));
const snapshot=()=>Object.fromEntries(keys().map(k=>[k,localStorage.getItem(k)]));
const hasData=obj=>Object.keys(obj).length>0;
const label=()=>new Date().toLocaleString('ko-KR');
function saveCurrent(){
 const data=snapshot();if(!hasData(data))return false;
 const a=archives();a.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2),name:'콘티 '+label(),savedAt:Date.now(),data});
 localStorage.setItem(ARCHIVE,JSON.stringify(a));return true;
}
function restore(data){keys().forEach(k=>localStorage.removeItem(k));Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));}
function start(){gate.remove();const frame=document.createElement('iframe');frame.id='app';frame.title='콘티 구성기';frame.src='./dictionary_step_7_5_fast_gemini.html';document.body.appendChild(frame);}
function showHome(){home.hidden=false;list.hidden=true;back.hidden=true;msg.textContent='작업을 시작할 방법을 선택하세요.'}
document.getElementById('new').onclick=()=>{
 try{saveCurrent();restore({});localStorage.setItem(ACTIVE,JSON.stringify({createdAt:Date.now()}));start()}
 catch(e){msg.textContent='저장 공간이 부족하거나 접근할 수 없어 새 프로젝트를 시작하지 않았습니다. 브라우저 저장 공간을 확인해 주세요.'}
};
document.getElementById('resume').onclick=()=>{
 home.hidden=true;list.hidden=false;back.hidden=false;list.replaceChildren();
 const current=document.createElement('button');current.textContent='▶ 최근 작업 이어서 하기';current.disabled=!hasData(snapshot());
 current.onclick=()=>start();list.appendChild(current);
 const a=archives();if(!a.length){const p=document.createElement('p');p.className='sub';p.textContent='아직 보관된 프로젝트가 없습니다.';list.appendChild(p)}
 a.forEach(entry=>{
 const row=document.createElement('div');row.className='item';const open=document.createElement('button');open.textContent=entry.name;
 open.onclick=()=>{if(!confirm('선택한 프로젝트를 열까요? 현재 작업은 먼저 보관됩니다.'))return;try{saveCurrent();restore(entry.data);start()}catch(e){msg.textContent='프로젝트를 불러오지 못했습니다. 저장 공간을 확인해 주세요.'}};
 const del=document.createElement('button');del.className='delete';del.textContent='삭제';del.setAttribute('aria-label',entry.name+' 삭제');
 del.onclick=()=>{if(!confirm('이 보관본을 삭제할까요?'))return;localStorage.setItem(ARCHIVE,JSON.stringify(archives().filter(x=>x.id!==entry.id)));document.getElementById('resume').click()};
 row.append(open,del);list.appendChild(row);
 });
};
back.onclick=showHome;
})();
</script></body></html>
