<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내장 생성형 AI</title><style>body{background:#16181e;color:#eee;font:16px system-ui;max-width:800px;margin:auto;padding:18px}textarea,select,button{font:inherit;background:#292d36;color:inherit;border:1px solid #555;border-radius:10px;padding:12px}textarea{width:100%;box-sizing:border-box;min-height:150px}button{margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222630;padding:16px}progress{width:100%}a{color:#a9c9ff}</style><h1>웹툰 생성형 AI</h1><p>Qwen 2.5 0.5B · WebLLM · API 키 불필요</p><p>첫 실행은 수백 MB의 다운로드가 발생할 수 있습니다. 실행 메모리 약 945MB 이상 예상. Wi-Fi 권장. WebGPU 지원 필요.</p><button id="load">모델 다운로드 및 시작</button><progress id="progress" max="1" value="0"></progress><p id="status" role="status">대기 중</p><select id="mode"><option>스토리 생성</option><option>콘티 구성</option><option>대사 수정</option><option>흐름 점검</option><option>클리셰 추천</option></select><textarea id="src" placeholder="작품 설정, 캐릭터 및 장면을 입력하세요"></textarea><button id="run" disabled>생성</button> <button id="stop" disabled>중지</button> <button id="clear">대화 초기화</button><pre id="out"></pre><button id="copy">결과 복사</button><p><a href="https://github.com/mlc-ai/web-llm">WebLLM</a> · <a href="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct">모델 정보</a> · <a href="dictionary.html">클리셰 사전으로 돌아가기</a></p><script type="module">
const $=id=>document.getElementById(id);let engine,history=[],busy=false;const model='Qwen2.5-0.5B-Instruct-q4f16_1-MLC';
$('load').onclick=async()=>{if(!navigator.gpu){$('status').textContent='이 브라우저는 WebGPU를 지원하지 않습니다.';return} $('load').disabled=true;try{const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('WebGPU 어댑터 없음');const {CreateMLCEngine}=await import('https://esm.run/@mlc-ai/web-llm@0.2.79');engine=await CreateMLCEngine(model,{initProgressCallback:p=>{$('progress').value=p.progress;$('status').textContent=p.text}},{context_window_size:1024});$('status').textContent='모델 준비 완료';$('run').disabled=false}catch(e){$('status').textContent='초기화 실패: '+e.message;$('load').disabled=false}};
$('run').onclick=async()=>{if(busy||!engine||!$('src').value.trim())return;busy=true;$('run').disabled=true;$('stop').disabled=false;$('clear').disabled=true;const task=$('mode').value+'\n'+$('src').value;const user={role:'user',content:task};let answer='';$('out').textContent='';const start=performance.now();try{const stream=await engine.chat.completions.create({messages:[{role:'system',content:'한국어 웹툰 창작 보조 AI. 제공된 설정을 유지하고 간결하고 구체적으로 답한다. 모든 연령에 적합한 내용을 생성한다.'},...history.slice(-2),user],stream:true,max_tokens:256,temperature:0.7});for await(const chunk of stream){answer+=chunk.choices[0]?.delta?.content||'';$('out').textContent=answer}history=[user,{role:'assistant',content:answer}];$('status').textContent='생성 종료 · '+((performance.now()-start)/1000).toFixed(1)+'초'}catch(e){$('status').textContent='생성 실패: '+e.message+' (입력이 너무 길면 줄여 주세요)'}finally{busy=false;$('run').disabled=false;$('stop').disabled=true;$('clear').disabled=false}};
$('stop').onclick=()=>engine?.interruptGenerate();$('clear').onclick=()=>{history=[];$('out').textContent='';$('status').textContent='대화 초기화'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').textContent);$('status').textContent='복사 완료'}catch(e){$('status').textContent='복사 실패: '+e.message}};
</script></html>
