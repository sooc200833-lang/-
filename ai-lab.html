<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웹툰 AI 실험실</title><style>body{background:#17191f;color:#eee;font:16px system-ui;max-width:800px;margin:auto;padding:20px}textarea,button,input{font:inherit;color:inherit;background:#292d36;border:1px solid #555;border-radius:10px;padding:12px;box-sizing:border-box}textarea{width:100%;min-height:160px}button{margin:8px 4px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222630;padding:16px;border-radius:12px}a{color:#a9c9ff}</style><h1>웹툰 AI 실험실</h1><p>초경량 학습 모델 실험 · API 키 불필요 · 기존 콘티와 독립</p><p>아래 모델은 한국어 예문으로 브라우저에서 직접 학습하는 TensorFlow.js 분류기입니다. 사전 학습 언어 모델이 아니며, 예문 밖의 문맥 이해는 제한적입니다.</p><textarea id="src">공주가 용에게 붙잡혔다는 소식을 듣는다.
용사가 깜짝 놀란다.
용사가 깜짝 놀란다.
동료가 기뻐하며 웃는다.</textarea><button id="run">모델 학습 및 분석</button><button id="add">학습 예문 추가</button><p id="status" role="status">대기 중</p><pre id="out"></pre><p>오픈소스 엔진: <a href="https://github.com/tensorflow/tfjs">TensorFlow.js (Apache-2.0)</a>. 첫 실행 시 CDN에서 엔진을 받습니다. 전체 전송량 및 iOS 호환성은 실기기 검증 전입니다.</p><script type="module">
const $=id=>document.getElementById(id), labels=['평온','기쁨','분노','슬픔','놀람','공포'];
const examples=[['조용히 앉아 있다','차분하게 대답한다','평온한 얼굴','담담하게 말한다','무표정으로 바라본다'],['기뻐하며 웃는다','행복한 미소','신나서 환호한다','즐겁게 웃었다','반가워한다'],['화가 나서 소리친다','분노하며 따진다','짜증을 낸다','화를 내며 노려본다','격분한다'],['슬퍼서 눈물을 흘린다','울먹인다','슬픈 표정','서럽게 운다','낙담한다'],['깜짝 놀란다','놀라서 눈이 커진다','충격을 받는다','당황한다','깜짝 놀랐다'],['무서워 떨고 있다','공포에 질린다','두려워한다','겁에 질렸다','무섭다']];
const N=512;function vec(s){const a=new Float32Array(N),t=s.normalize('NFKC').replace(/\s/g,'');for(let i=0;i<t.length;i++)for(let n=1;n<=2&&i+n<=t.length;n++){let h=0;for(const c of t.slice(i,i+n))h=(Math.imul(h,31)+c.charCodeAt(0))>>>0;a[h%N]++}const norm=Math.hypot(...a)||1;return Array.from(a,x=>x/norm)}
function sim(a,b){return a.reduce((s,x,i)=>s+x*b[i],0)}
let tf,model; $('add').onclick=()=>{const l=prompt('감정: '+labels.join(', '));if(!labels.includes(l))return;const s=prompt('한국어 학습 예문');if(s?.trim()){examples[labels.indexOf(l)].push(s.trim());model?.dispose();model=null;$('status').textContent='예문 추가됨. 다시 분석하세요.'}};
$('run').onclick=async()=>{ $('run').disabled=$('add').disabled=true;const start=performance.now();try{$('status').textContent='엔진 로딩 및 학습 중';tf??=await import('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/+esm');await tf.setBackend('cpu');await tf.ready();if(!model){const x=[],y=[];examples.forEach((arr,k)=>arr.forEach(s=>{x.push(vec(s));y.push(labels.map((_,i)=>+(i===k)))}));const m=tf.sequential();m.add(tf.layers.dense({inputShape:[N],units:6,activation:'softmax'}));m.compile({optimizer:tf.train.adam(.03),loss:'categoricalCrossentropy'});const xs=tf.tensor2d(x),ys=tf.tensor2d(y);try{await m.fit(xs,ys,{epochs:70,batchSize:8});model=m}catch(e){m.dispose();throw e}finally{xs.dispose();ys.dispose()}}
const lines=$('src').value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,100);if(!lines.length)throw Error('장면을 입력하세요');const v=lines.map(vec),p=tf.tidy(()=>model.predict(tf.tensor2d(v)).arraySync());const tropes=['왕국의 공주 구출','숨겨진 정체 공개','동료와의 재회','뜻밖의 배신','마왕 토벌 후 일상','위기 속 각성'];const results=lines.map((s,i)=>{const k=p[i].indexOf(Math.max(...p[i]));const nearest=tropes.map(t=>[t,sim(v[i],vec(t))]).sort((a,b)=>b[1]-a[1])[0];const dup=v.slice(0,i).map((a,j)=>[j,sim(a,v[i])]).filter(a=>a[1]>.85);return {컷:i+1,장면:s,감정_모델:labels[k],모델점수:Math.round(p[i][k]*100)+'%',표정추천:labels[k],구도_규칙:k===4||k===2?'CU':'MS',클리셰_문자유사도:nearest[1]>.1?nearest[0]:'추천 없음',중복후보:dup.map(a=>a[0]+1)}});$('out').textContent=JSON.stringify(results,null,2);$('status').textContent='완료 · '+Math.round(performance.now()-start)+'ms · 모델 가중치 약 '+((N+1)*6*4/1024).toFixed(1)+'KB (엔진 제외)';}catch(e){$('status').textContent='오류: '+e.message}finally{$('run').disabled=$('add').disabled=false}};
</script></html>
