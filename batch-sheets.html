<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘티·캐릭터 일괄 시트 도구</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#12121c;color:#f6f3ff}header{padding:16px;background:#211b31;border-bottom:1px solid #48405c}main{max-width:1000px;margin:auto;padding:15px}section{background:#222235;border:1px solid #42405a;border-radius:14px;padding:15px;margin:13px 0}h1{font-size:21px;margin:0}h2{font-size:17px}p,small{color:#b9b6cb}label{display:block;font-size:13px;margin:10px 0 5px}textarea,input,select,button{font:inherit;color:white;background:#323148;border:1px solid #56516b;border-radius:8px;padding:10px;max-width:100%}textarea,input:not([type=checkbox]),select{width:100%}textarea{min-height:75px;resize:vertical}button{cursor:pointer;margin:4px}button.primary{background:#7352c4}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.item{background:#2a293f;border-radius:10px;padding:12px;margin:10px 0}.tag{font-size:12px;color:#c3a8ff}.hidden{display:none}#output{min-height:250px;white-space:pre-wrap}.preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.preview div{border:1px dashed #74618d;border-radius:8px;padding:12px;min-height:85px;font-size:12px;overflow-wrap:anywhere}.warning{color:#e8c98c}@media(max-width:550px){.preview{grid-template-columns:repeat(2,minmax(0,1fr))}.row>*{flex-basis:100%}}</style></head><body><header><h1>▣ 콘티·캐릭터 일괄 시트 도구</h1><small>기존 사전 데이터는 변경하지 않는 독립형 실험 버전</small></header><main><section><div class="row"><button id="storyTab" class="primary">콘티 시트</button><button id="charTab">캐릭터 시트</button><button id="export">설정 JSON 백업</button><button id="importBtn">설정 JSON 불러오기</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div></section><section><label>작품 / 프로젝트</label><input id="project" placeholder="작품명"><label>공통 그림체 / 작화 규칙</label><textarea id="style" placeholder="한국 웹툰 스타일, 셀 셰이딩, 동일한 의상과 소품 유지"></textarea><label>캐릭터 고정 설정 (여러 인물은 줄바꿈)</label><textarea id="identity" placeholder="이름: 얼굴·머리·눈·의상·소품 등 절대 바뀌면 안 되는 특징"></textarea></section><section id="storySection"><h2>기존 콘티 기반 시트 구성</h2><p>기존 컷을 순서대로 붙여 넣으세요. 한 줄에 한 컷 또는 빈 줄로 컷 구분. 컷 개수는 제한하지 않고 장면별로 묶을 수 있습니다.</p><label>컷 내용 일괄 입력</label><textarea id="rawCuts" rows="7" placeholder="장면 1: 학교 복도&#10;컷 1: 복도를 걷는 박위 / 롱샷&#10;컷 2: 서진이 손을 잡는다 / 투샷&#10;장면 2: 회상&#10;컷 3: 바닥의 반지 / 클로즈업"></textarea><button id="parse" class="primary">컷 목록으로 변환</button><div id="cuts"></div><button id="addCut">컷 직접 추가</button><label>한 시트에 넣을 최대 컷 수 (장면 경계 우선)</label><select id="maxCuts"><option value="4">4컷</option><option value="6" selected>6컷</option><option value="9">9컷</option><option value="12">12컷</option></select><label><input id="sceneBreak" type="checkbox" checked> 장면이 바뀌면 새 시트 시작</label></section><section id="charSection" class="hidden"><h2>캐릭터 시트 구성</h2><label>시트 목적</label><select id="sheetType"><option value="expression">표정 — 동일 정면 구도</option><option value="angle">얼굴 각도 — 시점 변화</option><option value="pose">포즈 — 전신 동작</option><option value="situation">상황 — 다양한 장면과 카메라</option><option value="outfit">의상 — 동일 체형과 얼굴</option><option value="turnaround">턴어라운드 — 정면·측면·후면</option><option value="model">종합 모델 시트</option></select><label>시트 항목 (한 줄당 하나, 개수 자유)</label><textarea id="variants" rows="8"></textarea><button id="defaults">종류별 기본 항목 채우기</button><label>한 시트에 넣을 최대 항목</label><select id="maxChar"><option>4</option><option selected>6</option><option>9</option><option>16</option></select></section><section><h2>일괄 생성 계획</h2><button id="build" class="primary">시트 구성 및 프롬프트 생성</button><div id="summary" class="tag"></div><div id="preview" class="preview"></div></section><section><h2>이미지 생성 AI에 전달할 요청문</h2><p>시트마다 프롬프트가 따로 생성됩니다. 생성 이미지는 직접 올려서 분할할 수 있습니다.</p><select id="sheetSelect"></select><textarea id="output" readonly></textarea><div class="row"><button id="copy" class="primary">현재 시트 프롬프트 복사</button><button id="copyAll">전체 프롬프트 복사</button><button id="openGPT">ChatGPT 열기</button></div></section><section><h2>생성된 시트 분할</h2><p>균등 격자 이미지에만 사용하세요. 자유형 콘티 시트는 자동 분할이 정확하지 않을 수 있습니다.</p><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><div class="row"><label>열 수<input id="cols" type="number" min="1" max="16" value="2"></label><label>행 수<input id="rows" type="number" min="1" max="16" value="3"></label></div><button id="slice" class="primary">분할 이미지 ZIP 없이 개별 저장</button><p id="notice" class="warning"></p></section></main><script>
const $=id=>document.getElementById(id);let mode='story',cuts=[],prompts=[],groups=[];const defaults={expression:['평온','부드러운 미소','활짝 웃음','당황','놀람','분노','슬픔','울음','의심','결심','피곤','무표정','공포','안도','수줍음','비웃음'],angle:['정면','왼쪽 3/4','왼쪽 측면','오른쪽 3/4','오른쪽 측면','위에서 내려다봄','아래에서 올려다봄','뒤통수'],pose:['정면 서기','걷기','달리기','앉기','뒤돌아보기','물건 집기'],situation:['붐비는 거리에서 대화 / 투샷','빗속에서 기다림 / 롱샷','놀라서 뒤돌아봄 / 오버숄더','어두운 복도 탐색 / 로우앵글','친구를 발견함 / 미디엄샷','조용히 생각함 / 클로즈업'],outfit:['기본 의상','외투 착용','실내복','활동복'],turnaround:['정면 전신','왼쪽 측면 전신','후면 전신','오른쪽 측면 전신'],model:['정면 전신','측면 전신','얼굴 클로즈업','표정 3종','소품 상세','색상 팔레트']};
function save(){try{localStorage.setItem('batchSheetDraft',JSON.stringify({mode,cuts,project:$('project').value,style:$('style').value,identity:$('identity').value,rawCuts:$('rawCuts').value,variants:$('variants').value,sheetType:$('sheetType').value,maxCuts:$('maxCuts').value,maxChar:$('maxChar').value,sceneBreak:$('sceneBreak').checked}))}catch(e){}}
function tab(v){mode=v;$('storySection').classList.toggle('hidden',v!=='story');$('charSection').classList.toggle('hidden',v!=='character');$('storyTab').classList.toggle('primary',v==='story');$('charTab').classList.toggle('primary',v==='character');save()}
$('storyTab').onclick=()=>tab('story');$('charTab').onclick=()=>tab('character');
function parseCuts(){let scene='장면 1',n=0;cuts=[];for(const line of $('rawCuts').value.split(/\n+/)){const t=line.trim();if(!t)continue;if(/^\s*(?:장면|scene)\s*\d*\s*[:：\-]/i.test(t)){scene=t;continue}cuts.push({id:++n,scene,text:t.replace(/^\s*(?:컷|cut)\s*\d+\s*[:：.\-]\s*/i,'')})}renderCuts();save()}
function renderCuts(){const box=$('cuts');box.replaceChildren();for(const c of cuts){const el=document.createElement('div');el.className='item';const tag=document.createElement('small');tag.textContent='컷 '+c.id;const scene=document.createElement('input');scene.value=c.scene;scene.setAttribute('aria-label','장면');scene.oninput=()=>{c.scene=scene.value;save()};const txt=document.createElement('textarea');txt.value=c.text;txt.setAttribute('aria-label','컷 내용');txt.oninput=()=>{c.text=txt.value;save()};const remove=document.createElement('button');remove.textContent='이 컷 삭제';remove.onclick=()=>{cuts=cuts.filter(x=>x!==c);cuts.forEach((x,i)=>x.id=i+1);renderCuts();save()};el.append(tag,scene,txt,remove);box.append(el)}}
$('parse').onclick=parseCuts;$('addCut').onclick=()=>{cuts.push({id:cuts.length+1,scene:cuts.at(-1)?.scene||'장면 1',text:''});renderCuts();save()};$('defaults').onclick=()=>{$('variants').value=defaults[$('sheetType').value].join('\n');save()};$('sheetType').onchange=()=>{$('defaults').click()};
function chunk(items,max,byScene){let out=[],g=[];for(const c of items){if(g.length&&(g.length>=max||(byScene&&g[0].scene!==c.scene))){out.push(g);g=[]}g.push(c)}if(g.length)out.push(g);return out}
function build(){const identity=$('identity').value.trim(),style=$('style').value.trim(),project=$('project').value.trim();let items;if(mode==='story'){items=cuts.filter(c=>c.text.trim());groups=chunk(items,+$('maxCuts').value,$('sceneBreak').checked)}else{items=$('variants').value.split('\n').map(s=>s.trim()).filter(Boolean).map((text,i)=>({id:i+1,text,scene:'캐릭터'}));groups=chunk(items,+$('maxChar').value,false)}if(!groups.length){$('summary').textContent='먼저 컷 또는 시트 항목을 입력하세요.';return}prompts=groups.map((g,idx)=>{const type=$('sheetType').value;const constraints=mode==='story'?'기존 콘티에 있는 순서, 대사 의미, 등장인물, 카메라 구도, 시간과 장소를 바꾸지 마세요. 각 칸은 독립된 컷입니다. 인물의 위치와 샷 크기는 각 컷의 설명을 우선합니다.':'expression'===type?'모든 칸에서 동일한 얼굴·머리·의상·상반신 크기·정면 카메라를 유지하고 표정만 바꾸세요.':type==='angle'||type==='turnaround'?'동일 인물의 비율과 특징을 유지하되 지정된 카메라 각도를 정확히 구분하세요.':type==='situation'||type==='pose'?'같은 인물임을 유지하되 동작, 거리, 카메라 앵글, 배경을 항목마다 자연스럽게 변화시키세요.':'기본 얼굴·체형·고유 특징을 유지하면서 항목별 차이를 정확히 표현하세요.';return ['한 장의 이미지로 제작하는 일괄 '+(mode==='story'?'웹툰 콘티':'캐릭터')+' 시트 '+(idx+1)+'/'+groups.length,'작품: '+(project||'미지정'),'작화: '+(style||'일관된 한국 웹툰 스타일'),'절대 고정할 캐릭터 설정: '+(identity||'제공된 캐릭터 참조를 따름'),'구성: 총 '+g.length+'칸. 좌→우, 위→아래 순서. 동일 크기 셀, 일정한 여백, 테두리 없이 구분.','규칙: '+constraints,'다른 칸의 내용이 섞이지 않도록 하고 텍스트·말풍선·번호는 그리지 마세요.','시트 항목:',...g.map((c,i)=>(i+1)+'. '+(mode==='story'?'[원본 컷 '+c.id+'] '+c.scene+' / ':'')+c.text),'모든 대상이 프레임 안에 들어오게 하세요.'].join('\n')});$('summary').textContent=items.length+'개 항목 → '+groups.length+'장 시트 (원본 순서 유지)';const select=$('sheetSelect');select.replaceChildren();prompts.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent='시트 '+(i+1)+' ('+groups[i].length+'컷)';select.append(o)});showSheet();save()}
function showSheet(){const i=+$('sheetSelect').value||0;$('output').value=prompts[i]||'';const box=$('preview');box.replaceChildren();for(const c of groups[i]||[]){const el=document.createElement('div');el.textContent=(mode==='story'?'컷 '+c.id+' · ':'')+c.text;box.append(el)}const n=groups[i]?.length||1;$('cols').value=Math.min(n,Math.ceil(Math.sqrt(n)));$('rows').value=Math.ceil(n/+$('cols').value)}
$('build').onclick=build;$('sheetSelect').onchange=showSheet;
async function copy(s){try{await navigator.clipboard.writeText(s);$('notice').textContent='복사 완료'}catch(e){$('output').focus();$('output').select();$('notice').textContent='텍스트를 선택했어요. 복사 메뉴를 사용하세요.'}}
$('copy').onclick=()=>copy($('output').value);$('copyAll').onclick=()=>copy(prompts.map((p,i)=>'===== 시트 '+(i+1)+' =====\n'+p).join('\n\n'));$('openGPT').onclick=()=>window.open('https://chatgpt.com/','_blank','noopener');
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
$('slice').onclick=async()=>{try{const f=$('image').files[0];if(!f||!f.type.startsWith('image/'))throw Error('이미지를 선택하세요.');const cols=+$('cols').value,rows=+$('rows').value;if(!Number.isInteger(cols)||!Number.isInteger(rows)||cols<1||rows<1||cols*rows>256)throw Error('올바른 격자를 입력하세요.');const bmp=await createImageBitmap(f);try{const count=Math.min(groups[+$('sheetSelect').value]?.length||cols*rows,cols*rows);for(let i=0;i<count;i++){const x=Math.round(bmp.width*(i%cols)/cols),y=Math.round(bmp.height*Math.floor(i/cols)/rows),x2=Math.round(bmp.width*((i%cols)+1)/cols),y2=Math.round(bmp.height*(Math.floor(i/cols)+1)/rows);const c=document.createElement('canvas');c.width=x2-x;c.height=y2-y;c.getContext('2d').drawImage(bmp,x,y,c.width,c.height,0,0,c.width,c.height);const blob=await new Promise(res=>c.toBlob(res,'image/png'));if(blob)dl(blob,'sheet_'+(+$('sheetSelect').value+1)+'_item_'+(i+1)+'.png')}}finally{bmp.close()}$('notice').textContent='분할 이미지 다운로드를 요청했어요. 브라우저에서 여러 파일 저장을 허용해야 할 수 있습니다.'}catch(e){$('notice').textContent=e.message}};
$('export').onclick=()=>{save();dl(new Blob([localStorage.getItem('batchSheetDraft')||'{}'],{type:'application/json'}),'batch-sheet-draft.json')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async()=>{try{const f=$('importFile').files[0];if(!f||f.size>1e6)throw Error('1MB 이하 JSON만 지원합니다.');apply(JSON.parse(await f.text()));save()}catch(e){$('notice').textContent='불러오기 실패: '+e.message}};
function apply(d){if(!d||typeof d!=='object')throw Error('잘못된 데이터');for(const k of ['project','style','identity','rawCuts','variants'])if(typeof d[k]==='string')$(k).value=d[k];for(const k of ['sheetType','maxCuts','maxChar'])if(d[k]!=null&&[...$(k).options].some(o=>o.value===String(d[k])))$(k).value=d[k];$('sceneBreak').checked=d.sceneBreak!==false;cuts=Array.isArray(d.cuts)?d.cuts.filter(c=>c&&typeof c.text==='string'&&typeof c.scene==='string').slice(0,300).map((c,i)=>({id:i+1,text:c.text,scene:c.scene})):[];renderCuts();tab(d.mode==='character'?'character':'story')}
try{const d=JSON.parse(localStorage.getItem('batchSheetDraft')||'null');if(d)apply(d);else $('defaults').click()}catch(e){}document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('change',save));
</script></body></html>
