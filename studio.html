<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제작실 | 만화 클리셰 사전</title><style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color-scheme:dark;--bg:#11121c;--card:#202131;--line:#37394e;--accent:#a17afa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f3ff}header{position:sticky;top:0;z-index:3;background:#1b192b;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}header strong{font-size:17px}a{color:#c9b4ff}main{max-width:1200px;margin:auto;padding:18px 14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:14px}h1{font-size:23px;margin:0 0 7px}h2{font-size:17px;margin:0 0 13px}p,.muted{color:#b7b6c7;font-size:13px;line-height:1.6}input,select,button{font:inherit;border-radius:9px;padding:10px;background:#2b2b3e;color:white;border:1px solid #49465c;max-width:100%}input:not([type=file]),select{width:100%}button{cursor:pointer}button.primary{background:#7752cf;border-color:#7752cf}button:disabled{opacity:.45}label{display:block;font-size:12px;color:#c5c3d5;margin:10px 0 5px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.tabs button{flex:initial}.active{background:#7855d2!important}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:11px;margin-top:13px}.asset{padding:8px;border-radius:11px;background:#29293b;border:1px solid #3a3950;min-width:0;cursor:pointer;text-align:left}.asset img{width:100%;aspect-ratio:1;object-fit:contain;background:#151522;border-radius:7px}.asset strong,.asset small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset strong{font-size:12px;margin-top:5px}.asset small{font-size:11px;color:#a9a6bb}.asset.selected{outline:2px solid var(--accent)}#big{width:100%;max-height:420px;object-fit:contain;background:#151522;border-radius:10px}#status{min-height:1.3em}.hidden{display:none!important}#drop{border:2px dashed #6e5a9c;border-radius:12px;padding:20px;text-align:center;cursor:pointer}.tag{font-size:11px;color:#bda4ff}.actions button{flex:initial}@media(max-width:760px){.layout{display:flex;flex-direction:column}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}header strong{font-size:14px}.panel{padding:12px}}@media(max-width:380px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><strong>▣ 만화 클리셰 사전 · 제작실</strong><a href="./dictionary.html">사전으로 돌아가기</a></header><main><h1>이미지 제작실</h1><p>캐릭터·표정·웹툰 컷을 등록하고 편집하세요. 모든 이미지는 현재 브라우저에 저장됩니다.</p><div class="layout"><div><section class="panel"><div class="row tabs" id="filters"><button class="active" data-kind="all">전체</button><button data-kind="character">캐릭터</button><button data-kind="expression">표정</button><button data-kind="panel">웹툰 컷</button><button data-kind="background">배경</button></div><label for="search">검색</label><input id="search" placeholder="캐릭터·프로젝트 이름 검색"><p id="count" class="muted"></p><div id="gallery" class="gallery"></div></section><section class="panel hidden" id="detail"><h2>선택한 이미지</h2><img id="big" alt="선택한 이미지"><label for="editName">이름</label><input id="editName"><label for="editProject">프로젝트</label><input id="editProject" list="projects"><div class="row actions"><button class="primary" id="rename">변경 저장</button><button id="download">이미지 저장</button><button id="remove">삭제</button></div></section></div><aside><section class="panel"><h2>이미지 등록</h2><div id="drop">여기를 누르거나 이미지를 끌어 놓으세요<input id="file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden"></div><p id="fileInfo"></p><label for="name">이름</label><input id="name" placeholder="예: 박위_기본"><label for="project">프로젝트</label><input id="project" list="projects" placeholder="예: 모두 같은 얼굴"><datalist id="projects"><option>모두 같은 얼굴</option><option>강철의 요람</option><option>이세계 트럭용사</option><option>데이먼 프로젝트</option></datalist><label for="kind">종류</label><select id="kind"><option value="character">캐릭터</option><option value="expression">표정</option><option value="panel">웹툰 컷</option><option value="background">배경</option></select><label><input type="checkbox" id="split"> 4×4 시트를 16개 표정으로 분할</label><button class="primary" id="save">보관함에 등록</button><p id="status" role="status"></p></section><section class="panel"><h2>GitHub 이미지 가져오기</h2><p>공개 저장소의 이미지 파일 주소를 입력하면 등록할 수 있어요. GitHub로 자동 업로드하는 기능은 아직 없습니다.</p><label for="github">이미지 URL</label><input id="github" type="url" placeholder="https://raw.githubusercontent.com/..."><button id="import">이미지 가져오기</button><p id="importStatus" role="status"></p></section><section class="panel"><h2>보관함 내보내기</h2><p>백업 JSON에는 이미지도 포함됩니다. 다른 기기로 옮길 때 사용하세요.</p><button id="backup">전체 백업</button><button id="restore">백업 복원</button><input type="file" id="restoreFile" accept="application/json" class="hidden"></section></aside></div></main><script>
const $=id=>document.getElementById(id);let db,selected=null,filter='all',chosen=null;const msg=s=>$('status').textContent=s;const uuid=()=>crypto.randomUUID();
const open=indexedDB.open('namul-webtoon-images',1);open.onupgradeneeded=()=>{if(!open.result.objectStoreNames.contains('assets'))open.result.createObjectStore('assets',{keyPath:'id'})};open.onsuccess=()=>{db=open.result;render()};open.onerror=()=>msg('브라우저 저장소를 열 수 없습니다.');
function os(mode){return db.transaction('assets',mode).objectStore('assets')}function request(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}const all=()=>request(os('readonly').getAll());const put=a=>request(os('readwrite').put(a));const del=id=>request(os('readwrite').delete(id));const get=id=>request(os('readonly').get(id));
let shown=[];async function render(){if(!db)return;const q=$('search').value.toLowerCase();shown=(await all()).filter(a=>(filter==='all'||a.kind===filter)&&((a.name||'')+' '+(a.project||'')).toLowerCase().includes(q)).sort((a,b)=>b.created-a.created);$('count').textContent=shown.length+'개 이미지';const gallery=$('gallery');gallery.replaceChildren();for(const a of shown){const tile=document.createElement('button');tile.className='asset'+(selected===a.id?' selected':'');const img=document.createElement('img');const u=URL.createObjectURL(a.blob);img.src=u;img.onload=()=>URL.revokeObjectURL(u);const title=document.createElement('strong');title.textContent=a.name;const sub=document.createElement('small');sub.textContent=(a.project||'프로젝트 없음')+' · '+a.kind+(a.part?' '+a.part+'/16':'');tile.append(img,title,sub);tile.onclick=()=>select(a.id);gallery.append(tile)}if(!shown.length){const p=document.createElement('p');p.textContent='등록된 이미지가 없습니다.';gallery.append(p)}}
let detailUrl;async function select(id){selected=id;const a=await get(id);if(!a)return;if(detailUrl)URL.revokeObjectURL(detailUrl);detailUrl=URL.createObjectURL(a.blob);$('big').src=detailUrl;$('editName').value=a.name;$('editProject').value=a.project||'';$('detail').classList.remove('hidden');await render()}
$('filters').onclick=e=>{const b=e.target.closest('button[data-kind]');if(!b)return;filter=b.dataset.kind;for(const t of $('filters').querySelectorAll('button'))t.classList.toggle('active',t===b);render()};$('search').oninput=render;
$('drop').onclick=()=>$('file').click();$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();chosen=e.dataTransfer.files[0];fileInfo()};$('file').onchange=()=>{chosen=$('file').files[0];fileInfo()};function fileInfo(){$('fileInfo').textContent=chosen?chosen.name+' · '+(chosen.size/1048576).toFixed(1)+'MB':''}
function validate(f){if(!f||!['image/png','image/jpeg','image/webp'].includes(f.type))throw Error('PNG/JPEG/WebP 파일을 선택하세요.');if(f.size>8e6)throw Error('8MB 이하 파일만 지원합니다.')}
async function split16(f){const bitmap=await createImageBitmap(f),arr=[];try{for(let i=0;i<16;i++){const x=Math.round(bitmap.width*(i%4)/4),y=Math.round(bitmap.height*Math.floor(i/4)/4),x2=Math.round(bitmap.width*((i%4)+1)/4),y2=Math.round(bitmap.height*(Math.floor(i/4)+1)/4);const c=document.createElement('canvas');c.width=x2-x;c.height=y2-y;c.getContext('2d').drawImage(bitmap,x,y,c.width,c.height,0,0,c.width,c.height);arr.push(await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('분할 실패')),'image/png')))}}finally{bitmap.close()}return arr}
$('save').onclick=async()=>{if(!db)return;const name=$('name').value.trim();if(!name)return msg('이름을 입력하세요.');$('save').disabled=true;try{validate(chosen);const blobs=$('split').checked?await split16(chosen):[chosen];for(let i=0;i<blobs.length;i++)await put({id:uuid(),name:blobs.length===16?name+'_'+String(i+1).padStart(2,'0'):name,project:$('project').value.trim(),kind:blobs.length===16?'expression':$('kind').value,part:blobs.length===16?i+1:null,blob:blobs[i],created:Date.now()+i});msg(blobs.length+'개 저장 완료');await render()}catch(e){msg(e.message)}finally{$('save').disabled=false}};
$('rename').onclick=async()=>{if(!selected)return;const a=await get(selected);if(!a)return;a.name=$('editName').value.trim()||a.name;a.project=$('editProject').value.trim();await put(a);render()};
$('remove').onclick=async()=>{if(selected&&confirm('선택한 이미지를 삭제할까요?')){await del(selected);selected=null;$('detail').classList.add('hidden');render()}};
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
$('download').onclick=async()=>{const a=selected&&await get(selected);if(a)downloadBlob(a.blob,a.name+'.'+(a.blob.type==='image/jpeg'?'jpg':a.blob.type.split('/')[1]||'png'))};
$('import').onclick=async()=>{const s=$('importStatus');$('import').disabled=true;try{let u=new URL($('github').value.trim());if(u.hostname==='github.com'){const m=u.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);if(!m)throw Error('GitHub 파일 주소를 입력하세요.');u=new URL('https://raw.githubusercontent.com/'+m.slice(1).join('/'))}if(u.protocol!=='https:'||u.hostname!=='raw.githubusercontent.com')throw Error('GitHub 원본 이미지 주소만 지원합니다.');const r=await fetch(u.href);if(!r.ok)throw Error('HTTP '+r.status);const b=await r.blob();validate(b);const name=$('name').value.trim()||decodeURIComponent(u.pathname.split('/').pop()).replace(/\.[^.]+$/,'');await put({id:uuid(),name,project:$('project').value.trim(),kind:$('kind').value,part:null,blob:b,created:Date.now(),source:u.href});s.textContent='이미지 등록 완료';render()}catch(e){s.textContent='가져오기 실패: '+e.message}finally{$('import').disabled=false}};
const b64=blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)});
$('backup').onclick=async()=>{if(!db)return;const entries=[];for(const a of await all())entries.push({...a,blob:await b64(a.blob)});downloadBlob(new Blob([JSON.stringify({version:1,entries})],{type:'application/json'}),'namul-webtoon-backup.json')};
$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async()=>{try{const f=$('restoreFile').files[0];if(!f||f.size>80e6)throw Error('백업 파일이 너무 큽니다.');const data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.entries))throw Error('지원하지 않는 백업 형식');let n=0;for(const item of data.entries){if(typeof item.blob!=='string'||!item.blob.startsWith('data:image/'))continue;const blob=await(await fetch(item.blob)).blob();validate(blob);await put({id:uuid(),name:String(item.name||'이미지').slice(0,120),project:String(item.project||'').slice(0,120),kind:['character','expression','panel','background'].includes(item.kind)?item.kind:'panel',part:item.part||null,blob,created:Date.now()+n});n++}msg(n+'개 복원 완료');render()}catch(e){msg('복원 실패: '+e.message)}};
</script></body></html>
